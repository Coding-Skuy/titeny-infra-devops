name: scheduled-insight
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '15 * * * *'
  workflow_dispatch: {}
jobs:
  insight-harian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.7' }
      - name: Hitung prediksi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TITENY_API_TOKEN: ${{ secrets.TITENY_API_TOKEN }}
        run: |
          echo "Menjalankan insight harian Titeny (harga + panen)"
  harga-per-jam:
    runs-on: ubuntu-24.04
    if: github.event.schedule == '15 * * * *'
    steps:
      - run: echo "Perbarui harga per jam dari lumbung.harga.perbarui"
